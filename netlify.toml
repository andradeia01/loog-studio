# =============================================================================
# LOOG Studio — configuração Netlify
# =============================================================================
# Runtime Next 15 gerenciado pelo plugin oficial (@netlify/plugin-nextjs v5).
# Cada API route vira uma Netlify Function. Sharp compila pra Linux durante o
# `npm install` no CI (Netlify roda em Ubuntu).
# =============================================================================

[build]
  # Força npm a instalar binários sharp específicos pra linux-x64 ANTES do build.
  # Sem isso, package-lock só tem binários darwin (gerado no laptop do dev) e
  # as Netlify Functions quebram em runtime com "Could not load the sharp
  # module using the linux-x64 runtime".
  command = "npm install --os=linux --cpu=x64 --include=optional sharp && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--include=optional"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Garante que os binários nativos do sharp sejam empacotados nas Functions.
# Sem external_node_modules + included_files, o bundler Netlify remove os
# binários .node e as functions quebram em runtime.
[functions]
  external_node_modules = ["sharp"]
  included_files = [
    "node_modules/@img/sharp-linux-x64/**",
    "node_modules/@img/sharp-linuxmusl-x64/**",
    "node_modules/@img/sharp-libvips-linux-x64/**",
    "node_modules/@img/sharp-libvips-linuxmusl-x64/**",
  ]

# Assets estáticos com cache longo (o hash no filename já invalida quando muda)
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/templates/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
